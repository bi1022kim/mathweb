<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수학 튜터 - 학생 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl card-shadow p-8 w-full max-w-md animate-fade-in">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-800 mb-2">👨‍🎓 Student Login</h1>
                <p class="text-gray-600">Start learning English with AI</p>
            </div>

            <!-- 로그인 없이 시작하기 버튼 -->
            <button
                onclick="handleGuestLogin()"
                class="w-full mb-6 py-4 px-4 rounded-lg font-medium transition bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:from-green-600 hover:to-emerald-700 shadow-lg"
            >
                <div class="flex items-center justify-center gap-2">
                    <span class="text-xl">🚀</span>
                    <span>Start Instantly - No Login Required</span>
                </div>
            </button>

            <div class="relative mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">or sign in with account</span>
                </div>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input
                        type="text"
                        id="userId"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your username"
                        required
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Student ID (Optional)
                    </label>
                    <input
                        type="text"
                        id="studentId"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your student ID"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-purple-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-purple-700 transition"
                >
                    Sign In as Student
                </button>

                <div class="text-center space-y-2">
                    <p class="text-sm text-gray-600">
                        Don't have an account?
                        <a href="/signup" class="text-purple-600 hover:text-purple-700 font-medium">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function handleGuestLogin() {
            try {
                const response = await fetch('/guest-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    alert('게스트 로그인에 실패했습니다.');
                }
            } catch (error) {
                console.error('게스트 로그인 오류:', error);
                alert('로그인 중 오류가 발생했습니다.');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const studentId = document.getElementById('studentId').value.trim();

            if (!userId) {
                alert('아이디를 입력해주세요');
                return;
            }
            if (!password) {
                alert('비밀번호를 입력해주세요');
                return;
            }

            try {
                const response = await fetch('/student-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        role: 'student',
                        userId: userId,
                        password: password,
                        studentId: studentId
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    window.location.href = result.redirect || '/student';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('로그인 오류:', error);
                alert('로그인 중 오류가 발생했습니다.');
            }
        });
    </script>
</body>
</html>
