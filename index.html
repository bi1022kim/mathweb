<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 학습 - 학생 대시보드</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        .katex { font-size: 1.05em; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const userName = '게스트';
        // 유형을 바꾼 뒤에는 이전 30카드 진행 기록이 다른 단원에 붙지 않게 키를 분리한다.
        const STORAGE_KEY = 'mathweb-types30';

        function renderMathText(text) {
            if (text === null || text === undefined) return '';
            const parts = String(text).split(/(\$[^$]+\$)/);
            return parts.map(part => {
                if (part.length > 2 && part.startsWith('$') && part.endsWith('$')) {
                    if (typeof katex === 'undefined') return part;
                    try {
                        return katex.renderToString(part.slice(1, -1), { throwOnError: false });
                    } catch (e) {
                        return part;
                    }
                }
                return part
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }).join('');
        }

        function MathText({ text, className }) {
            const html = React.useMemo(() => renderMathText(text), [text]);
            return <span className={className} dangerouslySetInnerHTML={{ __html: html }} />;
        }

        function loadProgress() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        // 같은 단원 이름에 번호만 붙이지 않고, 유형 하나당 카드 한 장으로 보여 준다.
        function buildUnits() {
            const bank = window.QUESTION_BANK || { categories: [], questions: [] };
            return (bank.categories || []).map(cat => ({
                id: cat.id,
                title: cat.name,
                questions: (bank.questions || []).filter(q => q.category_id === cat.id)
            })).filter(unit => unit.questions.length > 0);
        }

        function gradeObjective(question, studentAnswer) {
            const choices = question.choices || [];
            const answerIndex = question.answer;
            const correctText = (typeof answerIndex === 'number' && choices[answerIndex] != null)
                ? choices[answerIndex]
                : '';
            const explanation = question.explanation || '';
            const isCorrect = typeof studentAnswer === 'string' && studentAnswer.trim() === String(correctText).trim();
            const feedback = isCorrect
                ? `정답입니다! ${explanation}`.trim()
                : `아쉽네요! 정답은 '${correctText}' 입니다. ${explanation}`.trim();
            return { isCorrect, feedback, explanation, correctText };
        }

        function formatQuestions(rawList) {
            return rawList.map(q => {
                const graded = gradeObjective(q, '');
                return {
                    id: q.id,
                    question: q.question_text || '',
                    options: q.choices || [],
                    correctAnswer: graded.correctText,
                    explanation: q.explanation || '',
                    raw: q
                };
            });
        }

        function resetUnit(unitId) {
            const progress = loadProgress();
            progress[unitId] = { answered: {} };
            saveProgress(progress);
        }

        function recordAnswer(unitId, questionId, isCorrect) {
            const progress = loadProgress();
            const slot = progress[unitId] || { answered: {} };
            slot.answered = slot.answered || {};
            slot.answered[questionId] = isCorrect;
            progress[unitId] = slot;
            saveProgress(progress);
        }

        function decorateUnits(units) {
            const progress = loadProgress();
            return units.map(unit => {
                const answered = (progress[unit.id] && progress[unit.id].answered) || {};
                const questionCount = Object.keys(answered).length;
                const correctCount = Object.values(answered).filter(Boolean).length;
                const total = unit.questions.length;
                const done = total > 0 && questionCount >= total;
                const score = done ? Math.round((correctCount / questionCount) * 100) : 0;
                return Object.assign({}, unit, { done, score });
            });
        }

        function App() {
            const [view, setView] = useState('landing');
            const [selectedUnit, setSelectedUnit] = useState(null);
            const units = buildUnits();

            const handleStart = (unit) => {
                resetUnit(unit.id);
                setSelectedUnit(unit);
                setView('learning');
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {view === 'landing' && (
                        <Landing onStart={() => setView('dashboard')} />
                    )}
                    {view === 'dashboard' && (
                        <StudentDashboard userName={userName} units={units} onStart={handleStart} />
                    )}
                    {view === 'learning' && selectedUnit && (
                        <LearningSession
                            userName={userName}
                            unit={selectedUnit}
                            onBack={() => setView('dashboard')}
                        />
                    )}
                </div>
            );
        }

        function Landing({ onStart }) {
            const stats = [
                { value: '30개', label: '학습 단원' },
                { value: '60문제', label: '정답 해설 포함' },
                { value: '즉시', label: '맞·틀 판정과 해설' }
            ];
            const steps = [
                { no: '01', title: '문제를 만나고', desc: '단원을 골라 부담 없이 오늘의 학습을 시작해요.' },
                { no: '02', title: '답을 고르고', desc: '객관식 답을 선택하면 맞았는지 바로 판정해 줘요.' },
                { no: '03', title: '해설로 이해해요', desc: '틀려도 괜찮아요. 수식 해설로 스스로 이해해요.' }
            ];
            const limeBtn = {
                background: '#c9f653',
                color: '#07111f',
                boxShadow: '0 12px 32px rgba(201, 246, 83, 0.25)'
            };
            return (
                <div className="min-h-screen" style={{ background: 'linear-gradient(120deg,#112b35,#0d2632 50%,#102836)', fontFamily: "'DM Sans','Noto Sans KR',sans-serif" }}>
                    {/* NAV */}
                    <nav className="max-w-6xl mx-auto px-6 h-16 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="w-9 h-9 rounded-xl flex items-center justify-center text-xl font-bold"
                                style={{ background: '#c9f653', color: '#07111f' }}>∑</span>
                            <span className="text-xl font-bold text-white">AI 수학 튜터</span>
                        </div>
                        <button onClick={onStart}
                            className="px-5 py-2 rounded-full text-sm font-bold transition hover:opacity-90" style={limeBtn}>
                            학습 시작
                        </button>
                    </nav>
                    {/* HERO */}
                    <section className="max-w-6xl mx-auto px-6 pt-16 pb-12 text-center">
                        <p className="text-sm font-bold mb-4" style={{ color: '#c9f653' }}>나만을 위한 AI 수학 코치</p>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-white leading-tight mb-5">
                            막히는 순간, <span style={{ color: '#65c7f2' }}>이해가 시작돼요.</span>
                        </h1>
                        <p className="text-lg mb-8" style={{ color: '#a9b9c6' }}>
                            답만 알려주는 대신, 스스로 풀 수 있도록 생각의 길을 열어주는<br className="hidden md:block" />
                            <strong className="text-white">가장 똑똑한 수학 학습 습관.</strong>
                        </p>
                        <button onClick={onStart}
                            className="px-8 py-4 rounded-full text-lg font-bold transition hover:-translate-y-0.5" style={limeBtn}>
                            무료로 학습 시작하기
                        </button>
                        <p className="mt-5 text-sm" style={{ color: '#9fb0c2' }}>
                            <strong className="text-white">초등 3~6학년</strong> 수학 단원 30개 · 문제 60문항 수록
                        </p>
                    </section>
                    {/* STATS */}
                    <section className="max-w-4xl mx-auto px-6 pb-16">
                        <div className="grid grid-cols-3 gap-4">
                            {stats.map(s => (
                                <div key={s.label} className="rounded-2xl p-6 text-center"
                                    style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid rgba(201,246,83,0.15)' }}>
                                    <p className="text-2xl md:text-3xl font-extrabold mb-1" style={{ color: '#c9f653' }}>{s.value}</p>
                                    <p className="text-xs md:text-sm" style={{ color: '#a9b9c6' }}>{s.label}</p>
                                </div>
                            ))}
                        </div>
                    </section>
                    {/* LEARNING LOOP */}
                    <section className="max-w-5xl mx-auto px-6 pb-20">
                        <p className="text-center text-xs font-bold tracking-widest mb-2" style={{ color: '#65c7f2' }}>LEARNING LOOP</p>
                        <h2 className="text-center text-2xl md:text-3xl font-bold text-white mb-10">모르는 문제를, 아는 개념으로.</h2>
                        <div className="grid md:grid-cols-3 gap-5">
                            {steps.map(st => (
                                <div key={st.no} className="rounded-2xl p-7"
                                    style={{ background: 'linear-gradient(145deg,#65c7f21a,#0c1d2d 60%)', border: '1px solid rgba(101,199,242,0.15)' }}>
                                    <p className="text-3xl font-extrabold mb-3" style={{ color: '#65c7f2' }}>{st.no}</p>
                                    <h3 className="text-lg font-bold text-white mb-2">{st.title}</h3>
                                    <p className="text-sm leading-relaxed" style={{ color: '#a9b9c6' }}>{st.desc}</p>
                                </div>
                            ))}
                        </div>
                    </section>
                    {/* CTA + FOOTER */}
                    <section className="max-w-5xl mx-auto px-6 pb-10 text-center">
                        <button onClick={onStart}
                            className="px-8 py-4 rounded-full text-lg font-bold transition hover:-translate-y-0.5" style={limeBtn}>
                            학생으로 시작하기
                        </button>
                        <p className="mt-4 text-sm" style={{ color: '#9fb0c2' }}>신용카드 없이, 로그인 없이 바로 시작할 수 있어요.</p>
                    </section>
                    <footer style={{ borderTop: '1px solid rgba(169,185,198,0.15)' }}>
                        <div className="max-w-6xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold"
                                    style={{ background: '#c9f653', color: '#07111f' }}>∑</span>
                                <span className="font-bold text-white">AI 수학 튜터</span>
                            </div>
                            <p className="text-sm" style={{ color: '#a9b9c6' }}>어려운 수학이, 기다려지는 시간이 되도록.</p>
                            <p className="text-xs" style={{ color: '#9db0bf' }}>© 2026 AI 수학 튜터</p>
                        </div>
                    </footer>
                </div>
            );
        }

        function StudentDashboard({ userName, units, onStart }) {
            const [rows, setRows] = React.useState([]);

            const handleLogout = () => {
                localStorage.removeItem(STORAGE_KEY);
                window.location.reload();
            };

            React.useEffect(() => {
                setRows(decorateUnits(units));
            }, [units]);

            const completed = rows.filter(row => row.done);
            const averageScore = completed.length
                ? Math.round((completed.reduce((sum, row) => sum + row.score, 0) / completed.length) * 10) / 10
                : 0;

            return (
                <div className="min-h-screen" style={{ background: 'linear-gradient(120deg,#112b35,#0d2632 50%,#102836)', fontFamily: "'DM Sans','Noto Sans KR',sans-serif" }}>
                    <nav style={{ borderBottom: '1px solid #b6cfe029' }}>
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold"
                                    style={{ background: '#c9f653', color: '#07111f' }}>∑</span>
                                <h1 className="text-xl font-bold text-white">AI 수학 튜터</h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm" style={{ color: '#a9b9c6' }}>👋 안녕하세요, {userName}</span>
                                <button onClick={handleLogout}
                                    className="px-4 py-1.5 rounded-full text-sm font-bold transition hover:opacity-90"
                                    style={{ background: '#c9f653', color: '#07111f' }}>나가기</button>
                            </div>
                        </div>
                    </nav>
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <h2 className="text-3xl font-bold text-white mb-6">학습 대시보드</h2>
                        <div className="grid md:grid-cols-3 gap-6 mb-8">
                            <StatCard title="남은 학습" value={rows.length - completed.length} />
                            <StatCard title="완료한 학습" value={completed.length} />
                            <StatCard title="평균 점수" value={averageScore} />
                        </div>
                        <div className="grid md:grid-cols-2 gap-4">
                            {rows.map(row => (
                                <div key={row.id} className="flex justify-between items-center rounded-2xl p-5"
                                    style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid #b6cfe029' }}>
                                    <div>
                                        <h3 className="font-bold text-white">{row.title}</h3>
                                        {row.done && (
                                            <p className="text-sm font-semibold" style={{ color: '#c9f653' }}>완료 · 점수 {row.score}</p>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => onStart(row)}
                                        className="px-4 py-2 rounded-full text-sm font-bold transition hover:opacity-90"
                                        style={{ background: '#c9f653', color: '#07111f' }}
                                    >
                                        {row.done ? '다시 풀기' : '시작하기'}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value }) {
            return (
                <div className="rounded-2xl p-6" style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid #b6cfe029' }}>
                    <span className="text-sm" style={{ color: '#a9b9c6' }}>{title}</span>
                    <p className="text-3xl font-extrabold" style={{ color: '#c9f653' }}>{value}</p>
                </div>
            );
        }

        function LearningSession({ userName, unit, onBack }) {
            const [questions] = useState(() => formatQuestions(unit.questions));
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [feedback, setFeedback] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [showResults, setShowResults] = useState(false);
            const [sessionScore, setSessionScore] = useState(0);

            const handleAnswer = (answer) => {
                setAnswers(Object.assign({}, answers, { [currentQuestion]: answer }));
            };

            const handleSubmitAnswer = () => {
                setSubmitting(true);
                const question = questions[currentQuestion];
                const result = gradeObjective(question.raw, answers[currentQuestion]);
                recordAnswer(unit.id, question.id, result.isCorrect);
                setFeedback({
                    isCorrect: result.isCorrect,
                    feedback: result.feedback,
                    correction: result.isCorrect ? '' : result.correctText,
                    explanation: result.explanation
                });
                setSubmitting(false);
            };

            const handleNextQuestion = () => {
                setFeedback(null);
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    const totalScore = Math.round(
                        (questions.filter((q, idx) => answers[idx] === q.correctAnswer).length / questions.length) * 100
                    );
                    setSessionScore(totalScore);
                    setShowResults(true);
                }
            };

            if (questions.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center" style={{ background: 'linear-gradient(120deg,#112b35,#0d2632 50%,#102836)' }}>
                        <button onClick={onBack} className="py-3 px-6 rounded-full font-bold transition hover:opacity-90"
                            style={{ background: '#c9f653', color: '#07111f' }}>돌아가기</button>
                    </div>
                );
            }

            if (showResults) {
                return (
                    <div className="min-h-screen" style={{ background: 'linear-gradient(120deg,#112b35,#0d2632 50%,#102836)', fontFamily: "'DM Sans','Noto Sans KR',sans-serif" }}>
                        <nav style={{ borderBottom: '1px solid #b6cfe029' }}>
                            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold"
                                    style={{ background: '#c9f653', color: '#07111f' }}>∑</span>
                                <h1 className="text-xl font-bold text-white">AI 수학 튜터</h1>
                            </div>
                        </nav>
                        <div className="max-w-3xl mx-auto px-4 py-12">
                            <div className="rounded-2xl p-8 text-center animate-fade-in"
                                style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid #b6cfe029' }}>
                                <div className="text-6xl mb-4">🎉</div>
                                <h2 className="text-3xl font-bold text-white mb-2">학습 완료!</h2>
                                <p className="mb-4" style={{ color: '#a9b9c6' }}>{unit.title} 학습을 마쳤습니다!</p>
                                <p className="text-5xl font-extrabold mb-8" style={{ color: '#c9f653' }}>점수: {sessionScore}%</p>
                                <button onClick={onBack} className="w-full py-3 rounded-full font-bold transition hover:opacity-90"
                                    style={{ background: '#c9f653', color: '#07111f' }}>
                                    학습 대시보드로 돌아가기
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const question = questions[currentQuestion];

            return (
                <div className="min-h-screen" style={{ background: 'linear-gradient(120deg,#112b35,#0d2632 50%,#102836)', fontFamily: "'DM Sans','Noto Sans KR',sans-serif" }}>
                    <nav style={{ borderBottom: '1px solid #b6cfe029' }}>
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold"
                                    style={{ background: '#c9f653', color: '#07111f' }}>∑</span>
                                <h1 className="text-xl font-bold text-white">AI 수학 튜터</h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm" style={{ color: '#a9b9c6' }}>👋 안녕하세요, {userName}</span>
                                <button onClick={onBack} className="px-4 py-1.5 rounded-full text-sm font-bold transition hover:opacity-90"
                                    style={{ background: '#c9f653', color: '#07111f' }}>← 돌아가기</button>
                            </div>
                        </div>
                    </nav>
                    <div className="max-w-3xl mx-auto px-4 py-8">
                        <div className="mb-4 flex justify-between items-center">
                            <p className="font-medium" style={{ color: '#a9b9c6' }}>문제 {currentQuestion + 1}/{questions.length}</p>
                            <span className="text-sm font-bold" style={{ color: '#65c7f2' }}>{unit.title}</span>
                        </div>
                        <div className="rounded-2xl p-8 mb-6 animate-fade-in"
                            style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid #b6cfe029' }}>
                            <p className="text-xl text-white mb-6"><MathText text={question.question} /></p>
                            <div className="space-y-2">
                                {question.options.map((opt, i) => (
                                    <button
                                        key={i}
                                        onClick={() => handleAnswer(opt)}
                                        disabled={feedback !== null}
                                        className="w-full p-4 rounded-xl text-left transition"
                                        style={{
                                            border: `1px solid ${answers[currentQuestion] === opt ? '#c9f653' : '#b6cfe029'}`,
                                            background: answers[currentQuestion] === opt ? 'rgba(201,246,83,0.12)' : 'rgba(11,24,41,0.6)',
                                            color: '#e9f3f5',
                                            opacity: feedback !== null ? 0.6 : 1
                                        }}
                                    >
                                        <MathText text={opt} />
                                    </button>
                                ))}
                            </div>
                            {!feedback && answers[currentQuestion] && (
                                <button
                                    onClick={handleSubmitAnswer}
                                    disabled={submitting}
                                    className="mt-6 w-full py-3 rounded-full font-bold transition hover:opacity-90 disabled:opacity-50"
                                    style={{ background: '#c9f653', color: '#07111f' }}
                                >
                                    {submitting ? '채점 중...' : '답 제출하기'}
                                </button>
                            )}
                        </div>
                        {feedback && (
                            <div className="rounded-2xl p-6 animate-fade-in"
                                style={{ background: 'linear-gradient(145deg, #c9f6531a, #0b1829)', border: '1px solid #b6cfe029' }}>
                                <div className="mb-4 p-4 rounded-xl"
                                    style={{ background: feedback.isCorrect ? 'rgba(201,246,83,0.12)' : 'rgba(255,107,107,0.12)' }}>
                                    <p className="font-semibold" style={{ color: feedback.isCorrect ? '#c9f653' : '#ff6b6b' }}>
                                        <MathText text={feedback.feedback} />
                                    </p>
                                    {feedback.correction && (
                                        <p className="mt-2" style={{ color: '#e9f3f5' }}>정답: <strong><MathText text={feedback.correction} /></strong></p>
                                    )}
                                </div>
                                {feedback.explanation && (
                                    <div className="mb-4 p-4 rounded-xl" style={{ background: 'rgba(101,199,242,0.1)' }}>
                                        <p className="text-sm font-bold mb-1" style={{ color: '#65c7f2' }}>💡 해설</p>
                                        <p style={{ color: '#e9f3f5' }}><MathText text={feedback.explanation} /></p>
                                    </div>
                                )}
                                <button onClick={handleNextQuestion} className="w-full py-3 rounded-full font-bold transition hover:opacity-90"
                                    style={{ background: '#c9f653', color: '#07111f' }}>
                                    {currentQuestion < questions.length - 1 ? '다음 문제' : '결과 보기'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        fetch('data/questions.json')
            .then(res => {
                if (!res.ok) throw new Error('questions.json 로드 실패');
                return res.json();
            })
            .then(data => {
                window.QUESTION_BANK = data;
                ReactDOM.render(<App />, document.getElementById('root'));
            })
            .catch(() => {
                document.getElementById('root').textContent = '문제를 불러오지 못했습니다.';
            });
    </script>
</body>
</html>
