<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 학습 - 학생 대시보드</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        .katex { font-size: 1.05em; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const userName = '게스트';
        // 유형을 바꾼 뒤에는 이전 30카드 진행 기록이 다른 단원에 붙지 않게 키를 분리한다.
        const STORAGE_KEY = 'mathweb-types30';

        function renderMathText(text) {
            if (text === null || text === undefined) return '';
            const parts = String(text).split(/(\$[^$]+\$)/);
            return parts.map(part => {
                if (part.length > 2 && part.startsWith('$') && part.endsWith('$')) {
                    if (typeof katex === 'undefined') return part;
                    try {
                        return katex.renderToString(part.slice(1, -1), { throwOnError: false });
                    } catch (e) {
                        return part;
                    }
                }
                return part
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }).join('');
        }

        function MathText({ text, className }) {
            const html = React.useMemo(() => renderMathText(text), [text]);
            return <span className={className} dangerouslySetInnerHTML={{ __html: html }} />;
        }

        function loadProgress() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        // 같은 단원 이름에 번호만 붙이지 않고, 유형 하나당 카드 한 장으로 보여 준다.
        function buildUnits() {
            const bank = window.QUESTION_BANK || { categories: [], questions: [] };
            return (bank.categories || []).map(cat => ({
                id: cat.id,
                title: cat.name,
                questions: (bank.questions || []).filter(q => q.category_id === cat.id)
            })).filter(unit => unit.questions.length > 0);
        }

        function gradeObjective(question, studentAnswer) {
            const choices = question.choices || [];
            const answerIndex = question.answer;
            const correctText = (typeof answerIndex === 'number' && choices[answerIndex] != null)
                ? choices[answerIndex]
                : '';
            const explanation = question.explanation || '';
            const isCorrect = typeof studentAnswer === 'string' && studentAnswer.trim() === String(correctText).trim();
            const feedback = isCorrect
                ? `정답입니다! ${explanation}`.trim()
                : `아쉽네요! 정답은 '${correctText}' 입니다. ${explanation}`.trim();
            return { isCorrect, feedback, explanation, correctText };
        }

        function formatQuestions(rawList) {
            return rawList.map(q => {
                const graded = gradeObjective(q, '');
                return {
                    id: q.id,
                    question: q.question_text || '',
                    options: q.choices || [],
                    correctAnswer: graded.correctText,
                    explanation: q.explanation || '',
                    raw: q
                };
            });
        }

        function resetUnit(unitId) {
            const progress = loadProgress();
            progress[unitId] = { answered: {} };
            saveProgress(progress);
        }

        function recordAnswer(unitId, questionId, isCorrect) {
            const progress = loadProgress();
            const slot = progress[unitId] || { answered: {} };
            slot.answered = slot.answered || {};
            slot.answered[questionId] = isCorrect;
            progress[unitId] = slot;
            saveProgress(progress);
        }

        function decorateUnits(units) {
            const progress = loadProgress();
            return units.map(unit => {
                const answered = (progress[unit.id] && progress[unit.id].answered) || {};
                const questionCount = Object.keys(answered).length;
                const correctCount = Object.values(answered).filter(Boolean).length;
                const total = unit.questions.length;
                const done = total > 0 && questionCount >= total;
                const score = done ? Math.round((correctCount / questionCount) * 100) : 0;
                return Object.assign({}, unit, { done, score });
            });
        }

        function App() {
            const [view, setView] = useState('dashboard');
            const [selectedUnit, setSelectedUnit] = useState(null);
            const units = buildUnits();

            const handleStart = (unit) => {
                resetUnit(unit.id);
                setSelectedUnit(unit);
                setView('learning');
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {view === 'dashboard' && (
                        <StudentDashboard userName={userName} units={units} onStart={handleStart} />
                    )}
                    {view === 'learning' && selectedUnit && (
                        <LearningSession
                            userName={userName}
                            unit={selectedUnit}
                            onBack={() => setView('dashboard')}
                        />
                    )}
                </div>
            );
        }

        function StudentDashboard({ userName, units, onStart }) {
            const [rows, setRows] = React.useState([]);

            const handleLogout = () => {
                localStorage.removeItem(STORAGE_KEY);
                window.location.reload();
            };

            React.useEffect(() => {
                setRows(decorateUnits(units));
            }, [units]);

            const completed = rows.filter(row => row.done);
            const averageScore = completed.length
                ? Math.round((completed.reduce((sum, row) => sum + row.score, 0) / completed.length) * 10) / 10
                : 0;

            return (
                <div className="min-h-screen bg-gray-50">
                    <nav className="bg-white shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-purple-600">AI 수학 튜터</h1>
                            <div className="flex items-center gap-4">
                                <span className="text-gray-700">👋 안녕하세요, {userName}</span>
                                <button onClick={handleLogout}>나가기</button>
                            </div>
                        </div>
                    </nav>
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <h2 className="text-3xl font-bold mb-6">학습 대시보드</h2>
                        <div className="grid md:grid-cols-3 gap-6 mb-8">
                            <StatCard title="남은 학습" value={rows.length - completed.length} />
                            <StatCard title="완료한 학습" value={completed.length} />
                            <StatCard title="평균 점수" value={averageScore} />
                        </div>
                        <div className="bg-white rounded-xl p-6 card-shadow space-y-4">
                            {rows.map(row => (
                                <div key={row.id} className="flex justify-between items-center border p-4 rounded">
                                    <div>
                                        <h3 className="font-bold">{row.title}</h3>
                                        {row.done && (
                                            <p className="text-sm text-green-600">완료 · 점수 {row.score}</p>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => onStart(row)}
                                        className="bg-purple-600 text-white px-4 py-2 rounded"
                                    >
                                        {row.done ? '다시 풀기' : '시작하기'}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value }) {
            return (
                <div className="bg-white rounded-xl p-6 card-shadow">
                    <span className="text-gray-600">{title}</span>
                    <p className="text-3xl font-bold text-purple-600">{value}</p>
                </div>
            );
        }

        function LearningSession({ userName, unit, onBack }) {
            const [questions] = useState(() => formatQuestions(unit.questions));
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [feedback, setFeedback] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [showResults, setShowResults] = useState(false);
            const [sessionScore, setSessionScore] = useState(0);

            const handleAnswer = (answer) => {
                setAnswers(Object.assign({}, answers, { [currentQuestion]: answer }));
            };

            const handleSubmitAnswer = () => {
                setSubmitting(true);
                const question = questions[currentQuestion];
                const result = gradeObjective(question.raw, answers[currentQuestion]);
                recordAnswer(unit.id, question.id, result.isCorrect);
                setFeedback({
                    isCorrect: result.isCorrect,
                    feedback: result.feedback,
                    correction: result.isCorrect ? '' : result.correctText,
                    explanation: result.explanation
                });
                setSubmitting(false);
            };

            const handleNextQuestion = () => {
                setFeedback(null);
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    const totalScore = Math.round(
                        (questions.filter((q, idx) => answers[idx] === q.correctAnswer).length / questions.length) * 100
                    );
                    setSessionScore(totalScore);
                    setShowResults(true);
                }
            };

            if (questions.length === 0) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <button onClick={onBack} className="bg-purple-600 text-white py-3 px-6 rounded-lg">돌아가기</button>
                    </div>
                );
            }

            if (showResults) {
                return (
                    <div className="min-h-screen bg-gray-50">
                        <nav className="bg-white shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center">
                                <h1 className="text-2xl font-bold text-purple-600">AI 수학 튜터</h1>
                            </div>
                        </nav>
                        <div className="max-w-3xl mx-auto px-4 py-12">
                            <div className="bg-white rounded-xl card-shadow p-8 text-center animate-fade-in">
                                <div className="text-6xl mb-4">🎉</div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">학습 완료!</h2>
                                <p className="text-gray-600 mb-4">{unit.title} 학습을 마쳤습니다!</p>
                                <p className="text-5xl font-bold text-purple-600 mb-8">점수: {sessionScore}%</p>
                                <button onClick={onBack} className="w-full bg-purple-600 text-white py-3 px-4 rounded-lg font-medium">
                                    학습 대시보드로 돌아가기
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const question = questions[currentQuestion];

            return (
                <div className="min-h-screen bg-gray-50">
                    <nav className="bg-white shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-purple-600">AI 수학 튜터</h1>
                            <div className="flex items-center gap-4">
                                <span className="text-gray-700">👋 안녕하세요, {userName}</span>
                                <button onClick={onBack} className="px-4 py-2 text-sm text-gray-700">← 돌아가기</button>
                            </div>
                        </div>
                    </nav>
                    <div className="max-w-3xl mx-auto px-4 py-8">
                        <div className="mb-4 flex justify-between items-center">
                            <p className="text-gray-600 font-medium">문제 {currentQuestion + 1}/{questions.length}</p>
                            <span className="text-sm text-purple-600 font-medium">{unit.title}</span>
                        </div>
                        <div className="bg-white rounded-xl card-shadow p-8 mb-6 animate-fade-in">
                            <p className="text-xl text-gray-800 mb-6"><MathText text={question.question} /></p>
                            <div className="space-y-2">
                                {question.options.map((opt, i) => (
                                    <button
                                        key={i}
                                        onClick={() => handleAnswer(opt)}
                                        disabled={feedback !== null}
                                        className={`w-full p-4 border rounded-lg text-left transition ${
                                            answers[currentQuestion] === opt ? 'border-purple-500 bg-purple-50' : 'border-gray-200 hover:border-purple-300'
                                        } ${feedback !== null ? 'cursor-not-allowed opacity-60' : ''}`}
                                    >
                                        <MathText text={opt} />
                                    </button>
                                ))}
                            </div>
                            {!feedback && answers[currentQuestion] && (
                                <button
                                    onClick={handleSubmitAnswer}
                                    disabled={submitting}
                                    className="mt-6 w-full bg-purple-600 text-white py-3 px-4 rounded-lg font-medium disabled:opacity-50"
                                >
                                    {submitting ? '채점 중...' : '답 제출하기'}
                                </button>
                            )}
                        </div>
                        {feedback && (
                            <div className="bg-white rounded-xl card-shadow p-6 animate-fade-in">
                                <div className={`mb-4 p-4 rounded-lg ${feedback.isCorrect ? 'bg-green-50' : 'bg-red-50'}`}>
                                    <p className={`font-semibold ${feedback.isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                                        <MathText text={feedback.feedback} />
                                    </p>
                                    {feedback.correction && (
                                        <p className="text-gray-700 mt-2">정답: <strong><MathText text={feedback.correction} /></strong></p>
                                    )}
                                </div>
                                {feedback.explanation && (
                                    <div className="mb-4 p-4 bg-blue-50 rounded-lg">
                                        <p className="text-sm font-semibold text-blue-700 mb-1">💡 해설</p>
                                        <p className="text-gray-700"><MathText text={feedback.explanation} /></p>
                                    </div>
                                )}
                                <button onClick={handleNextQuestion} className="w-full bg-purple-600 text-white py-3 rounded-lg font-medium">
                                    {currentQuestion < questions.length - 1 ? '다음 문제' : '결과 보기'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        fetch('data/questions.json')
            .then(res => {
                if (!res.ok) throw new Error('questions.json 로드 실패');
                return res.json();
            })
            .then(data => {
                window.QUESTION_BANK = data;
                ReactDOM.render(<App />, document.getElementById('root'));
            })
            .catch(() => {
                document.getElementById('root').textContent = '문제를 불러오지 못했습니다.';
            });
    </script>
</body>
</html>
